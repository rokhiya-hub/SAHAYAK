server:
  port: 8085

spring:
  application:
    name: reporting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sahayak}
    username: ${DB_USERNAME:sahayak}
    password: ${DB_PASSWORD:sahayak}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me!}

reporting:
  services:
    victims-url: ${VICTIM_SERVICE_URL:http://localhost:8081}
    shelters-url: ${SHELTER_SERVICE_URL:http://localhost:8082}
    resources-url: ${RESOURCE_SERVICE_URL:http://localhost:8083}
    volunteers-url: ${VOLUNTEER_SERVICE_URL:http://localhost:8084}
  connect-timeout: 2s
  response-timeout: 5s
  page-size: 500