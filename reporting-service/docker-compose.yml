services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak
    ports:
      - "5435:5432"
    volumes:
      - reporting-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sahayak
      DB_USERNAME: sahayak
      DB_PASSWORD: sahayak
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-change-me!}
      VICTIM_SERVICE_URL: ${VICTIM_SERVICE_URL:-http://host.docker.internal:8081}
      SHELTER_SERVICE_URL: ${SHELTER_SERVICE_URL:-http://host.docker.internal:8082}
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL:-http://host.docker.internal:8083}
      VOLUNTEER_SERVICE_URL: ${VOLUNTEER_SERVICE_URL:-http://host.docker.internal:8084}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reporting-pgdata: