server:
  port: 8084

spring:
  application:
    name: volunteer-dispatch-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sahayak}
    username: ${DB_USERNAME:sahayak}
    password: ${DB_PASSWORD:sahayak}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me!}
  expiration-ms: 86400000

shelter-service:
  url: ${SHELTER_SERVICE_URL:http://localhost:8082}
  connect-timeout: 2s
  response-timeout: 3s