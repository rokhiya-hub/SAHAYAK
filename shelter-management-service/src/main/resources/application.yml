server:
  port: 8082

spring:
  application:
    name: shelter-management-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sahayak}
    username: ${DB_USERNAME:sahayak}
    password: ${DB_PASSWORD:sahayak}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  # HMAC-SHA256 signing key (>= 32 bytes). Override with JWT_SECRET in production.
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me!}
  expiration-ms: 86400000