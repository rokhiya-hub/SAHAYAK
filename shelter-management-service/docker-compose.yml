services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sahayak
      DB_USERNAME: sahayak
      DB_PASSWORD: sahayak
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me!
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: